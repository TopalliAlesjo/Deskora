[package]
name = "deskora"
version = "0.1.0"
edition = "2024"
description = "Deskora: un viewer VNC essenziale per Windows, scritto in Rust"
license = "PolyForm-Noncommercial-1.0.0"

[build-dependencies]
embed-resource = "=2.5.2"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png"] }
des = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
jpeg-decoder = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
